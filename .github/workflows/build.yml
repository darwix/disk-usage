name: build
on:
  push: # branches and tags; a v* tag also publishes a release
  pull_request:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: DiskUsage
          path: dist/DiskUsage.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} dist/DiskUsage.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
